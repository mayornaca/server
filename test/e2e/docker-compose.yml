services:
  public:
    image: android-sms-gateway/server:public
    build:
      context: ../..
      dockerfile: ./build/package/Dockerfile
      args:
        - APP=sms-gateway
    environment:
      - DEBUG=
      - CONFIG_PATH=config.yml
      - GOOSE_DBSTRING=sms:sms@tcp(db:3306)/sms
      - HTTP__LISTEN=0.0.0.0:3000
      - DATABASE__HOST=db
      - DATABASE__PORT=3306
      - DATABASE__USER=sms
      - DATABASE__PASSWORD=sms
      - DATABASE__DATABASE=sms-public
      - GATEWAY__MODE=public
      - FCM__CREDENTIALS_JSON=${FCM__CREDENTIALS_JSON}
    ports:
      - "3000:3000"
    volumes:
      - ./data/config.yml:/app/config.yml:ro
    restart: "unless-stopped"
    depends_on:
      db:
        condition: service_healthy

  private:
    image: android-sms-gateway/server:private
    build:
      context: ../..
      dockerfile: ./build/package/Dockerfile
      args:
        - APP=sms-gateway
    environment:
      - DEBUG=
      - CONFIG_PATH=config.yml
      - GOOSE_DBSTRING=sms:sms@tcp(db:3306)/sms
      - HTTP__LISTEN=0.0.0.0:3000
      - DATABASE__HOST=db
      - DATABASE__PORT=3306
      - DATABASE__USER=sms
      - DATABASE__PASSWORD=sms
      - DATABASE__DATABASE=sms-private
      - GATEWAY__MODE=private
      - GATEWAY__PRIVATE_TOKEN=123456789
    ports:
      - "3001:3000"
    volumes:
      - ./data/config.yml:/app/config.yml:ro
    restart: "unless-stopped"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mariadb:lts
    environment:
      - MARIADB_ROOT_PASSWORD=root
      - MARIADB_AUTO_UPGRADE=1
    volumes:
      - ./data/10-init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
    restart: "unless-stopped"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      start_period: 4s
      interval: 4s
      timeout: 2s
      retries: 3

  worker-resilience:
    # Solo se levanta con --profile resilience (test/e2e/worker_db_resilience_test.go).
    # Mismo image que public/private pero comando `worker`. NO usa `restart: always`
    # — el test valida que el worker NO crashea durante restart de db, así que
    # cualquier exit del container es failure.
    profiles: ["resilience"]
    image: android-sms-gateway/server:public
    build:
      context: ../..
      dockerfile: ./build/package/Dockerfile
      args:
        - APP=sms-gateway
    command: ["/app/app", "worker"]
    environment:
      - DEBUG=
      - CONFIG_PATH=config.yml
      - GOOSE_DBSTRING=sms:sms@tcp(db:3306)/sms
      - DATABASE__HOST=db
      - DATABASE__PORT=3306
      - DATABASE__USER=sms
      - DATABASE__PASSWORD=sms
      - DATABASE__DATABASE=sms-public
    volumes:
      - ./data/config.yml:/app/config.yml:ro
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
